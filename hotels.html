<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3a6b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="나라예매">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>숙박 예약 - 나라예매</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .tab-btn { padding:7px 18px; border-radius:20px; border:1.5px solid var(--border); background:white; font-size:.88rem; font-weight:600; cursor:pointer; transition:all .15s; color:var(--text-muted); }
    .tab-btn.active { background:var(--primary-light); color:white; border-color:var(--primary-light); }
    .hotel-list { display:flex; flex-direction:column; gap:14px; }
    .hotel-card { background:white; border-radius:12px; border:1.5px solid var(--border); padding:20px 24px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; box-shadow:var(--shadow); transition:border-color .2s; position:relative; }
    .hotel-card:hover { border-color:var(--primary-light); }
    .hotel-icon { font-size:2.8rem; }
    .hotel-name { font-size:1.05rem; font-weight:700; color:var(--primary); margin-bottom:4px; }
    .hotel-location { font-size:.85rem; color:var(--text-muted); margin-bottom:8px; }
    .hotel-amenities { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .amenity-tag { background:#f0f7ff; color:#1d4ed8; border-radius:20px; padding:2px 10px; font-size:.76rem; font-weight:600; }
    .hotel-stars { color:#f59e0b; font-size:.9rem; }
    .hotel-right { text-align:right; flex-shrink:0; }
    .hotel-price-label { font-size:.78rem; color:var(--text-muted); }
    .hotel-price { font-size:1.3rem; font-weight:800; color:var(--primary); margin-bottom:2px; }
    .hotel-price-night { font-size:.75rem; color:var(--text-muted); }
    .hotel-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
    .fav-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; color:#ccc; padding:4px; transition:all .15s; }
    .fav-btn.active { color:#e53e3e; }
    .money-bar { background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:.85rem; display:flex; justify-content:space-between; align-items:center; }
    .money-bar .label { color:#0369a1; }
    .money-bar .amount { font-weight:700; color:#0c4a6e; }
    .price-preview { background:#f0f7ff; border-radius:8px; padding:12px 14px; margin:14px 0; font-size:.88rem; }
    .price-preview .row { display:flex; justify-content:space-between; padding:3px 0; }
    .price-preview .total { font-size:1.05rem; font-weight:800; color:var(--primary); border-top:1px solid #bfdbfe; margin-top:6px; padding-top:6px; }
    @media(max-width:640px) { .hotel-card { grid-template-columns:auto 1fr; } .hotel-right { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; } }
  </style>
</head>
<body>
<div id="header-wrap"></div>
<div class="container">
  <p class="page-title">🏨 숙박 예약</p>
  <p class="page-subtitle">호텔과 캠핑장을 예약하세요</p>

  <div id="money-wrap" style="display:none;" class="money-bar">
    <span class="label">💰 게임 머니</span>
    <span class="amount" id="money-amt">-</span>
  </div>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('전체',this)">전체</button>
    <button class="tab-btn" onclick="setFilter('호텔',this)">🏨 호텔</button>
    <button class="tab-btn" onclick="setFilter('캠핑장',this)">⛺ 캠핑장</button>
  </div>

  <div id="hotel-list" class="hotel-list"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
</div>

<!-- 예약 모달 -->
<div class="modal-overlay" id="book-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="m-title">숙박 예약</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-info" style="background:#f8fafc;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:.88rem;"></div>
    <div class="form-row">
      <div class="form-group">
        <label>체크인</label>
        <input type="date" id="m-checkin" oninput="calcPrice()">
      </div>
      <div class="form-group">
        <label>체크아웃</label>
        <input type="date" id="m-checkout" oninput="calcPrice()">
      </div>
    </div>
    <div class="form-group">
      <label>인원</label>
      <input type="number" id="m-guests" min="1" max="10" value="2" oninput="calcPrice()">
    </div>
    <div class="price-preview" id="price-preview" style="display:none;">
      <div class="row"><span>숙박 요금</span><span id="pp-rate"></span></div>
      <div class="row"><span>박수</span><span id="pp-nights"></span></div>
      <div class="row total"><span>결제 금액</span><span id="pp-total"></span></div>
    </div>
    <div style="margin-bottom:16px;">
      <div style="font-size:.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">쿠폰 코드</div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="m-coupon" placeholder="쿠폰 코드 입력 (예: NARA10)" style="flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;text-transform:uppercase;outline:none;">
        <button class="btn btn-outline btn-sm" onclick="applyCoupon()">적용</button>
      </div>
      <div id="coupon-msg" style="font-size:.82rem;margin-top:6px;"></div>
    </div>
    <div id="m-alert" class="alert alert-error" style="display:none;"></div>
    <button class="btn btn-accent btn-full" id="m-book-btn" onclick="confirmBooking()">예약하기</button>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  document.getElementById('header-wrap').innerHTML = renderHeader('hotels');
  seedIfEmpty();

  let allHotels = {}, currentFilter = '전체', selectedId = null, userFavs = {}, ratings = {};
  let couponDiscount = 0, appliedCoupon = '';
  const user = getUser();

  async function init() {
    if (user && !user.isAdmin) {
      try {
        const money = await getUserMoney(user.uid);
        document.getElementById('money-amt').textContent = `₩${money.toLocaleString()}`;
        document.getElementById('money-wrap').style.display = 'flex';
        userFavs = (await getFavorites(user.uid)).hotel || {};
      } catch(e) {}
    }
    try {
      [allHotels, ratings] = await Promise.all([dbGet('hotels'), loadRatings('hotel')]);
      allHotels = allHotels || {};
      render();
    } catch(e) {
      document.getElementById('hotel-list').innerHTML = '<div class="alert alert-error">데이터를 불러올 수 없습니다.</div>';
    }
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const items = Object.entries(allHotels).filter(([,h]) => currentFilter === '전체' || h.category === currentFilter);
    if (!items.length) {
      document.getElementById('hotel-list').innerHTML = '<div class="empty-state"><div class="icon">🏨</div><p>숙박 시설이 없습니다.</p></div>';
      return;
    }
    document.getElementById('hotel-list').innerHTML = items.map(([id, h]) => {
      const stars = h.category === '호텔' ? '⭐'.repeat(h.stars) : '';
      const amenities = (h.amenities || []).map(a => `<span class="amenity-tag">${a}</span>`).join('');
      const isFav = !!userFavs[id];
      return `<div class="hotel-card">
        <div class="hotel-icon">${h.img}</div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="hotel-name">${h.name}</span>
            <span class="badge ${h.category==='호텔'?'badge-blue':'badge-green'}">${h.category}</span>
            ${stars ? `<span class="hotel-stars">${stars}</span>` : ''}
            ${ratingHTML(ratings[id])}
          </div>
          <div class="hotel-location">📍 ${h.location}</div>
          <div class="hotel-amenities">${amenities}</div>
        </div>
        <div class="hotel-right">
          <div>
            <div class="hotel-price-label">1박 기준</div>
            <div class="hotel-price">₩${h.pricePerNight.toLocaleString()}</div>
          </div>
          <div class="hotel-btns">
            ${user ? `<button class="fav-btn${isFav?' active':''}" id="fav-${id}" onclick="toggleFav('${id}',this)">❤️</button>` : ''}
            <button class="btn btn-accent btn-sm" onclick="openModal('${id}')">예약하기</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  async function toggleFav(id, btn) {
    if (!user) { alert('로그인이 필요합니다.'); return; }
    try {
      const on = await toggleFavorite(user.uid, 'hotel', id);
      btn.classList.toggle('active', on);
      if (on) userFavs[id] = true; else delete userFavs[id];
    } catch(e) {}
  }

  function openModal(id) {
    if (!user) { window.location.href = 'login.html'; return; }
    selectedId = id;
    const h = allHotels[id];
    document.getElementById('m-title').textContent = h.name;
    document.getElementById('m-info').innerHTML = `<b>${h.img} ${h.name}</b><br>📍 ${h.location} &nbsp;|&nbsp; 1박 ₩${h.pricePerNight.toLocaleString()}`;
    document.getElementById('m-alert').style.display = 'none';
    document.getElementById('price-preview').style.display = 'none';
    document.getElementById('m-coupon').value = '';
    document.getElementById('coupon-msg').textContent = '';
    couponDiscount = 0; appliedCoupon = '';
    // set min dates
    const today = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(Date.now()+86400000).toISOString().split('T')[0];
    document.getElementById('m-checkin').value = today;
    document.getElementById('m-checkin').min = today;
    document.getElementById('m-checkout').value = tomorrow;
    document.getElementById('m-checkout').min = tomorrow;
    calcPrice();
    document.getElementById('book-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('book-modal').classList.remove('open');
    selectedId = null;
  }

  function calcPrice() {
    if (!selectedId) return;
    const h = allHotels[selectedId];
    const ci = document.getElementById('m-checkin').value;
    const co = document.getElementById('m-checkout').value;
    if (!ci || !co || co <= ci) { document.getElementById('price-preview').style.display='none'; return; }
    const nights = Math.round((new Date(co)-new Date(ci))/(1000*60*60*24));
    const total = nights * h.pricePerNight;
    document.getElementById('pp-rate').textContent = `₩${h.pricePerNight.toLocaleString()}/박`;
    document.getElementById('pp-nights').textContent = `${nights}박`;
    const finalTotal = Math.max(0, total - couponDiscount);
    document.getElementById('pp-total').textContent = couponDiscount > 0
      ? `₩${finalTotal.toLocaleString()} (₩${couponDiscount.toLocaleString()} 할인)`
      : `₩${total.toLocaleString()}`;
    document.getElementById('price-preview').style.display = 'block';
  }

  async function applyCoupon() {
    const code = document.getElementById('m-coupon').value.trim();
    const msgEl = document.getElementById('coupon-msg');
    if (!code) return;
    const h = allHotels[selectedId];
    const ci = document.getElementById('m-checkin').value;
    const co = document.getElementById('m-checkout').value;
    if (!ci || !co || co <= ci) { msgEl.style.color='#dc2626'; msgEl.textContent='날짜를 먼저 선택해 주세요.'; return; }
    const nights = Math.round((new Date(co)-new Date(ci))/(1000*60*60*24));
    const basePrice = nights * h.pricePerNight;
    try {
      const result = await validateCoupon(code, basePrice);
      couponDiscount = result.discount; appliedCoupon = code;
      msgEl.style.color='#15803d'; msgEl.textContent=`✅ ${result.name} — ₩${result.discount.toLocaleString()} 할인 적용!`;
      calcPrice();
    } catch(e) { couponDiscount=0; appliedCoupon=''; msgEl.style.color='#dc2626'; msgEl.textContent=`❌ ${e.message}`; calcPrice(); }
  }

  async function confirmBooking() {
    if (!selectedId || !user) return;
    const h = allHotels[selectedId];
    const ci = document.getElementById('m-checkin').value;
    const co = document.getElementById('m-checkout').value;
    const guests = parseInt(document.getElementById('m-guests').value) || 1;
    const alertEl = document.getElementById('m-alert');
    alertEl.style.display = 'none';

    if (!ci || !co || co <= ci) {
      alertEl.textContent = '날짜를 올바르게 입력해 주세요.'; alertEl.style.display = 'flex'; return;
    }
    const nights = Math.round((new Date(co)-new Date(ci))/(1000*60*60*24));
    const price = Math.max(0, nights * h.pricePerNight - couponDiscount);

    const btn = document.getElementById('m-book-btn');
    btn.textContent = '처리 중...'; btn.disabled = true;
    try {
      const remaining = await deductMoney(user.uid, price);
      if (appliedCoupon) await useCoupon(appliedCoupon);
      const booking = {
        type: 'hotel', userId: user.uid, userName: user.name,
        itemId: selectedId, title: h.name, location: h.location, category: h.category,
        checkIn: ci, checkOut: co, nights, guests,
        pricePerNight: h.pricePerNight, coupon: appliedCoupon || null, discount: couponDiscount,
        price, status: '예매완료', bookedAt: Date.now()
      };
      const res = await dbPush('bookings', booking);
      const newId = res.name;
      window.location.href = `confirm.html?id=${newId}&spent=${price}&left=${remaining}`;
    } catch(e) {
      alertEl.textContent = e.message || '예약 중 오류가 발생했습니다.'; alertEl.style.display = 'flex';
      btn.textContent = '예약하기'; btn.disabled = false;
    }
  }

  init();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
