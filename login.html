<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 나라예매</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      background: white;
      border-radius: 14px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .icon { font-size: 2.4rem; }
    .auth-logo h2 { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: 8px; }
    .auth-logo p { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; }
    .divider { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 20px 0; position: relative; }
    .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--border); }
    .divider span { background: white; padding: 0 12px; position: relative; }
  </style>
</head>
<body>

<div id="header-wrap"></div>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon">🏛️</div>
      <h2>나라예매 로그인</h2>
      <p>계속하려면 로그인하세요</p>
    </div>

    <div id="alert-wrap"></div>

    <form id="login-form">
      <div class="form-group">
        <label>아이디</label>
        <input type="text" id="uid" placeholder="아이디를 입력하세요" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="pw" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">로그인</button>
    </form>

    <div class="divider"><span>또는</span></div>

    <p style="text-align:center; font-size:0.9rem; color:var(--text-muted);">
      계정이 없으신가요? <a href="register.html" style="color:var(--primary-light); font-weight:600;">회원가입</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  document.getElementById('header-wrap').innerHTML = renderHeader('');

  // 이미 로그인된 경우
  if (getUser()) window.location.href = 'index.html';

  function showAlert(msg, type = 'error') {
    document.getElementById('alert-wrap').innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const uid = document.getElementById('uid').value.trim();
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('login-btn');

    if (!uid || !pw) return showAlert('아이디와 비밀번호를 입력하세요.');

    btn.textContent = '로그인 중...';
    btn.disabled = true;

    try {
      // 관리자 체크 (Firebase 조회 전에 먼저)
      if (uid === ADMIN.id && pw === ADMIN.pw) {
        setUser({ uid: 'admin', name: '관리자', isAdmin: true });
        window.location.href = 'admin.html';
        return;
      }

      const gameUser = await loginWithGame(uid, pw);
      if (!gameUser) return showAlert('아이디 또는 비밀번호가 틀렸습니다.');

      setUser(gameUser);
      window.location.href = 'index.html';
    } catch (err) {
      showAlert('로그인 중 오류가 발생했습니다. 다시 시도해 주세요.');
    } finally {
      btn.textContent = '로그인';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
